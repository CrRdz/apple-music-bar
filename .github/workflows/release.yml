name: Release macOS app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build universal app and publish release
    runs-on: macos-15
    env:
      APP_NAME: AppleMusicBar
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      MUSICKIT_BUNDLE_ID: ${{ secrets.MUSICKIT_BUNDLE_ID }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and bundle version
        shell: zsh {0}
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [[ "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "Tag $RELEASE_TAG does not match Info.plist version $VERSION"
            exit 1
          fi

      - name: Run tests
        run: swift test

      - name: Configure Developer ID signing
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.BUILD_KEYCHAIN_PASSWORD }}
        shell: zsh {0}
        run: |
          set -euo pipefail
          if [[ -z "$CERTIFICATE_BASE64" && -z "$CERTIFICATE_PASSWORD" && -z "$KEYCHAIN_PASSWORD" ]]; then
            echo "CODE_SIGN_IDENTITY=-" >> "$GITHUB_ENV"
            echo "Developer ID secrets are not configured; building an ad-hoc signed app."
            exit 0
          fi
          if [[ -z "$CERTIFICATE_BASE64" || -z "$CERTIFICATE_PASSWORD" || -z "$KEYCHAIN_PASSWORD" ]]; then
            echo "Developer ID signing secrets are only partially configured."
            exit 1
          fi
          if [[ -z "$MUSICKIT_BUNDLE_ID" ]]; then
            echo "MUSICKIT_BUNDLE_ID is required for a MusicKit-enabled signed release."
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/apple-music-bar.keychain-db"
          print -rn -- "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F '\"' 'NR == 1 { print $2 }')"
          if [[ -z "$IDENTITY" ]]; then
            echo "No code-signing identity was found in the imported certificate."
            exit 1
          fi
          echo "CODE_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build universal application bundle
        shell: zsh {0}
        run: |
          set -euo pipefail
          swift build -c release --arch arm64 --scratch-path .build/arm64
          swift build -c release --arch x86_64 --scratch-path .build/x86_64
          ARM_BIN_DIR="$(swift build -c release --arch arm64 --scratch-path .build/arm64 --show-bin-path)"
          X86_BIN_DIR="$(swift build -c release --arch x86_64 --scratch-path .build/x86_64 --show-bin-path)"
          APP_PATH="$PWD/dist/$APP_NAME.app"

          rm -rf "$APP_PATH"
          mkdir -p "$APP_PATH/Contents/MacOS"
          lipo -create \
            "$ARM_BIN_DIR/$APP_NAME" \
            "$X86_BIN_DIR/$APP_NAME" \
            -output "$APP_PATH/Contents/MacOS/$APP_NAME"
          cp Resources/Info.plist "$APP_PATH/Contents/Info.plist"
          if [[ -n "$MUSICKIT_BUNDLE_ID" ]]; then
            /usr/libexec/PlistBuddy \
              -c "Set :CFBundleIdentifier $MUSICKIT_BUNDLE_ID" \
              "$APP_PATH/Contents/Info.plist"
          fi
          chmod +x "$APP_PATH/Contents/MacOS/$APP_NAME"
          if [[ "$CODE_SIGN_IDENTITY" == "-" ]]; then
            codesign --force --deep --sign - "$APP_PATH"
          else
            codesign \
              --force \
              --deep \
              --options runtime \
              --timestamp \
              --sign "$CODE_SIGN_IDENTITY" \
              "$APP_PATH"
          fi

          ARCHS="$(lipo -archs "$APP_PATH/Contents/MacOS/$APP_NAME")"
          [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]]

      - name: Package release disk image
        shell: zsh {0}
        run: |
          set -euo pipefail
          DMG_NAME="$APP_NAME-$RELEASE_TAG-macOS-universal.dmg"

          mkdir -p release
          chmod +x scripts/package-dmg.sh
          scripts/package-dmg.sh \
            "dist/$APP_NAME.app" \
            "release/$DMG_NAME" \
            "$APP_NAME $RELEASE_TAG"

          cd release
          shasum -a 256 "$DMG_NAME" > "$DMG_NAME.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: zsh {0}
        run: |
          set -euo pipefail
          DMG_NAME="$APP_NAME-$RELEASE_TAG-macOS-universal.dmg"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
            while IFS= read -r asset; do
              case "$asset" in
                "$DMG_NAME"|"$DMG_NAME.sha256") ;;
                *) gh release delete-asset "$RELEASE_TAG" "$asset" --yes ;;
              esac
            done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          else
            gh release create "$RELEASE_TAG" release/* \
              --verify-tag \
              --generate-notes \
              --title "Apple Music Bar $RELEASE_TAG"
          fi
